name: P0.3 review fix3 once

on:
  push:
    branches:
      - p0-3-storage-alias

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-3-storage-alias
          fetch-depth: 0
      - name: Install toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y clang gcc ruby python3 cmake ninja-build llvm-dev libclang-dev
      - name: Apply third semantic review fixes
        run: python3 scripts/p03_review_fix3_once.py
      - name: Validate patched tree
        run: |
          bash scripts/check.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build build
          ctest --test-dir build --output-on-failure
          git diff --check
      - name: Commit reviewed fixes and remove temporary patch machinery
        run: |
          git config user.name "C& review bot"
          git config user.email "noreply@github.com"
          git rm .github/workflows/p03-review-fix3-once.yml scripts/p03_review_fix3_once.py
          git add src/cand.cpp tests/storage
          git diff --check
          git commit -m "fix: close P0.3 pointer transport and parameter gaps"
          git push origin HEAD:p0-3-storage-alias
