name: C&1 extended differential fuzzing

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang-18=1:18.1.3-1ubuntu1 llvm-18=1:18.1.3-1ubuntu1
          llvm-18-dev=1:18.1.3-1ubuntu1 libclang-18-dev=1:18.1.3-1ubuntu1
          libclang-rt-18-dev=1:18.1.3-1ubuntu1
          gcc-13=13.3.0-6ubuntu2~24.04.1 g++-13=13.3.0-6ubuntu2~24.04.1
          ruby python3 python3-jsonschema cmake=3.28.3-1build7 ninja-build=1.11.1-2
          && sudo ln -sf /usr/lib/llvm-18/bin/clang /usr/local/bin/clang
          && sudo ln -sf /usr/lib/llvm-18/bin/clang++ /usr/local/bin/clang++
          && sudo ln -sf /usr/bin/gcc-13 /usr/local/bin/gcc
          && sudo ln -sf /usr/bin/g++-13 /usr/local/bin/g++
          && sudo ln -sf /usr/bin/gcc-13 /usr/local/bin/cc
      - name: Configure and build
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18
          && /usr/bin/cmake --build build
      - name: Run extended differential corpus
        run: |
          python3 tests/fuzz/runner.py --cand build/cand --mode extended --seed 12345 --output build/cand1-c-extended-12345
          python3 tests/fuzz/runner.py --cand build/cand --mode extended --seed 67890 --output build/cand1-c-extended-67890
      - name: Run independent exact-head corpus
        run: python3 tests/fuzz/independent.py --cand build/cand
      - name: Preserve reports
        uses: actions/upload-artifact@v4
        with:
          name: cand1-c-extended-reports
          path: build/cand1-c-extended-*/report.json
