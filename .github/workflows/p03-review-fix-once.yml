name: P0.3 review fix once

on:
  push:
    branches:
      - p0-3-storage-alias

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-3-storage-alias
          fetch-depth: 0
      - name: Apply semantic review fixes
        run: python3 scripts/p03_review_fix_once.py
      - name: Commit reviewed fixes and remove temporary patch machinery
        run: |
          git config user.name "C& review bot"
          git config user.email "noreply@github.com"
          git rm .github/workflows/p03-review-fix-once.yml scripts/p03_review_fix_once.py
          git add src/cand.cpp tests/storage
          git diff --check
          git commit -m "fix: harden P0.3 alias and aggregate fail-closed semantics"
          git push origin HEAD:p0-3-storage-alias
