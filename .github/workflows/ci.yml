name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install toolchain dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang-18=1:18.1.3-1ubuntu1 llvm-18=1:18.1.3-1ubuntu1
          llvm-18-dev=1:18.1.3-1ubuntu1 libclang-18-dev=1:18.1.3-1ubuntu1
          libclang-rt-18-dev=1:18.1.3-1ubuntu1
          gcc-13=13.3.0-6ubuntu2~24.04.1 g++-13=13.3.0-6ubuntu2~24.04.1
          ruby python3 python3-jsonschema cmake=3.28.3-1build7 ninja-build=1.11.1-2
          && sudo ln -sf /usr/lib/llvm-18/bin/clang /usr/local/bin/clang
          && sudo ln -sf /usr/lib/llvm-18/bin/clang++ /usr/local/bin/clang++
          && sudo ln -sf /usr/bin/gcc-13 /usr/local/bin/gcc
          && sudo ln -sf /usr/bin/g++-13 /usr/local/bin/g++
          && sudo ln -sf /usr/bin/gcc-13 /usr/local/bin/cc
      - name: Validate project baseline
        run: bash scripts/check.sh
      - name: Build pinned reference environment
        run: docker build --provenance=false -f toolchains/Dockerfile -t cand1-v1-toolchain .
      - name: Run pinned reference validation
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE":/src/cand -w /src/cand
          cand1-v1-toolchain bash -c
          'git config --global --add safe.directory /src/cand &&
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18 && cmake --build build
          && ctest --test-dir build --output-on-failure'
