name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y clang gcc ruby python3
      - name: Validate project baseline
        run: bash scripts/check.sh
