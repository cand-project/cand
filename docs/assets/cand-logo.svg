<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">C&amp; — C with Ownership</title>
  <desc id="desc">C&amp; project logo. Keep C. Add ownership.</desc>
  <defs>
    <linearGradient id="cand-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b3157"/>
      <stop offset="1" stop-color="#0aa0a4"/>
    </linearGradient>
    <style>
      .word{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#17212b}
      .sub{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#445261;letter-spacing:5px}
    </style>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#ffffff"/>
  <!-- The stylized C is the C in C&. The wordmark therefore adds only the ampersand. -->
  <g transform="translate(120 44)">
    <path d="M230 45a135 135 0 1 0 2 190l-53-49a62 62 0 1 1 0-91z" fill="url(#cand-gradient)"/>
    <rect x="102" y="126" width="128" height="22" rx="11" fill="#0b6077"/>
    <rect x="102" y="161" width="128" height="22" rx="11" fill="#0aa0a4"/>
    <circle cx="242" cy="154.5" r="38" fill="#0aa0a4"/>
    <circle cx="242" cy="154.5" r="21" fill="#ffffff"/>
  </g>
  <text x="425" y="205" class="word" font-size="166" font-weight="750">&amp;</text>
  <text x="425" y="255" class="sub" font-size="31">C WITH OWNERSHIP</text>
  <line x1="425" y1="285" x2="1035" y2="285" stroke="#9fc6cf" stroke-width="3"/>
  <text x="425" y="337" class="word" font-size="32" letter-spacing="3">Keep C. Add ownership.</text>
</svg>
