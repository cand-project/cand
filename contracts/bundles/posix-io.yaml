schema: cand.api-contract/v1
name: cand-posix-io
version: "1.0.0"

# Reviewed POSIX file-descriptor bundle (POSIX.1-2017 12.2 close).
#
# Trusted claim: close() takes a by-value integer file descriptor; it
# reads no caller memory, retains nothing, and returns an int. The C type
# system forbids passing a pointer at this position. The resource
# referenced by the descriptor is released, but no C pointer object in the
# caller changes ownership, so the parameter is no_ownership_effect.
#
# Deliberately excluded: read/write (buffer positions are borrow-shaped
# but were not required by any measured pilot; add with fresh evidence
# first), fcntl (variadic third argument), dup2-style operations, and all
# FILE*-based stdio (retains the stream pointer across calls).
#
# Provenance: contracts/evidence/posix-io.md.

symbols:
  - symbol: close
    kind: function
    params:
      - index: 0
        effect: no_ownership_effect
